<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160b04" />
    <meta
      name="description"
      content="Your Good Time is launching soon. Your journey written in the stars."
    />
    <title>Your Good Time | Coming Soon</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .page {
        min-height: 100svh;
      }

      .splash-page {
        position: relative;
        min-height: 100svh;
        padding: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 24%, rgba(255, 207, 126, 0.2), transparent 28%),
          radial-gradient(circle at 18% 78%, rgba(255, 123, 0, 0.18), transparent 26%),
          radial-gradient(circle at 85% 18%, rgba(42, 83, 152, 0.2), transparent 30%),
          linear-gradient(155deg, #070604 0%, #160b04 48%, #060403 100%);
        color: #fff0c9;
      }

      .splash-page::before,
      .splash-page::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .splash-page::before {
        z-index: -2;
        background:
          radial-gradient(circle at 14% 18%, rgba(255, 221, 164, 0.72) 0 1px, transparent 2px),
          radial-gradient(circle at 31% 32%, rgba(255, 202, 106, 0.58) 0 1px, transparent 2px),
          radial-gradient(circle at 75% 16%, rgba(255, 232, 180, 0.68) 0 1px, transparent 2px),
          radial-gradient(circle at 84% 58%, rgba(255, 199, 95, 0.55) 0 1px, transparent 2px),
          radial-gradient(circle at 24% 82%, rgba(255, 225, 166, 0.5) 0 1px, transparent 2px),
          linear-gradient(90deg, rgba(255, 215, 141, 0.035) 1px, transparent 1px);
        background-size: auto, auto, auto, auto, auto, 96px 100%;
        animation: splashStars 5.4s ease-in-out infinite;
      }

      .splash-page::after {
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(7, 6, 4, 0), rgba(7, 6, 4, 0.68)),
          radial-gradient(ellipse at center, transparent 0 42%, rgba(0, 0, 0, 0.38) 82%);
      }

      .splash-sky {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .splash-sky::before,
      .splash-sky::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 9% 44%, rgba(255, 238, 194, 0.84) 0 1px, transparent 2px),
          radial-gradient(circle at 18% 62%, rgba(255, 199, 97, 0.66) 0 1px, transparent 2px),
          radial-gradient(circle at 39% 14%, rgba(255, 233, 181, 0.72) 0 1px, transparent 2px),
          radial-gradient(circle at 55% 29%, rgba(255, 200, 92, 0.62) 0 1px, transparent 2px),
          radial-gradient(circle at 69% 73%, rgba(255, 233, 181, 0.68) 0 1px, transparent 2px),
          radial-gradient(circle at 91% 45%, rgba(255, 210, 128, 0.72) 0 1px, transparent 2px);
        animation: glitterPulse 2.2s ease-in-out infinite;
      }

      .splash-sky::after {
        background:
          radial-gradient(circle at 12% 73%, rgba(255, 217, 148, 0.7) 0 1px, transparent 2px),
          radial-gradient(circle at 28% 21%, rgba(255, 244, 214, 0.72) 0 1px, transparent 2px),
          radial-gradient(circle at 47% 86%, rgba(255, 192, 88, 0.72) 0 1px, transparent 2px),
          radial-gradient(circle at 77% 28%, rgba(255, 229, 169, 0.82) 0 1px, transparent 2px),
          radial-gradient(circle at 88% 70%, rgba(255, 244, 214, 0.68) 0 1px, transparent 2px);
        animation-delay: 1.1s;
        animation-duration: 2.8s;
      }

      .splash-arc {
        position: absolute;
        left: 50%;
        top: 47%;
        border: 1px solid rgba(255, 214, 143, 0.16);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .arc-one {
        width: min(76vw, 420px);
        height: min(76vw, 420px);
        animation: splashOrbit 14s linear infinite;
      }

      .arc-two {
        width: min(104vw, 560px);
        height: min(104vw, 560px);
        border-color: rgba(255, 214, 143, 0.09);
        animation: splashOrbit 18s linear infinite reverse;
      }

      .splash-star {
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ffd180;
        box-shadow: 0 0 24px rgba(255, 188, 82, 0.82);
      }

      .splash-light-rays {
        position: absolute;
        left: 50%;
        top: 74%;
        width: 120vmax;
        height: 120vmax;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0.04) rotate(0deg);
        opacity: 0;
        background:
          repeating-conic-gradient(
            from 0deg,
            rgba(255, 220, 145, 0) 0deg 18deg,
            rgba(255, 222, 148, 0.24) 19deg 22deg,
            rgba(255, 220, 145, 0) 23deg 46deg
          );
        mask-image: radial-gradient(circle, rgba(0, 0, 0, 0) 0 8%, #000 18%, rgba(0, 0, 0, 0.8) 42%, rgba(0, 0, 0, 0) 72%);
        -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 0) 0 8%, #000 18%, rgba(0, 0, 0, 0.8) 42%, rgba(0, 0, 0, 0) 72%);
        filter: blur(0.25px) drop-shadow(0 0 38px rgba(255, 185, 72, 0.56));
        animation: splashRayExpand 6.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .splash-temple {
        position: absolute;
        left: 50%;
        bottom: -16px;
        width: min(132vw, 640px);
        max-height: 56svh;
        object-fit: contain;
        opacity: 1;
        transform: translate(-50%, 24px) scale(0.94);
        filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.52));
        animation: templeRise 1.2s cubic-bezier(0.18, 1, 0.22, 1) 700ms forwards;
      }

      .star-one {
        left: 23%;
        top: 25%;
        animation: starDrift 4.6s ease-in-out infinite;
      }

      .star-two {
        right: 18%;
        top: 37%;
        width: 7px;
        height: 7px;
        animation: starDrift 5.8s ease-in-out 0.5s infinite;
      }

      .star-three {
        left: 66%;
        bottom: 20%;
        width: 6px;
        height: 6px;
        animation: starDrift 5.2s ease-in-out 1s infinite;
      }

      .splash-content {
        position: relative;
        z-index: 1;
        width: min(92%, 430px);
        min-height: 100svh;
        padding: 48px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 13px;
        text-align: center;
        padding-top: 5svh;
      }

      .splash-eyebrow {
        margin: 0 0 -2px;
        padding: 7px 13px;
        border: 1px solid rgba(255, 213, 143, 0.26);
        border-radius: 999px;
        background: rgba(255, 229, 181, 0.08);
        color: #ffd48a;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(8px);
        animation: splashFadeUp 700ms ease-out 120ms forwards;
      }

      .logo-wrap {
        width: clamp(132px, 38vw, 178px);
        aspect-ratio: 1;
        position: relative;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 34%, rgba(255, 238, 192, 0.34), rgba(255, 172, 57, 0.08) 54%, rgba(15, 8, 4, 0.4)),
          rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 221, 154, 0.24);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 24px 58px rgba(0, 0, 0, 0.48),
          0 0 54px rgba(255, 147, 34, 0.18);
        opacity: 0;
        transform: translateY(14px) scale(0.94);
        animation:
          splashLogoEnter 900ms cubic-bezier(0.18, 1, 0.22, 1) 250ms forwards,
          logoFloat 4.8s ease-in-out 1.2s infinite;
      }

      .logo-wrap::before,
      .logo-wrap::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .logo-wrap::before {
        inset: -18%;
        background: conic-gradient(
          from 0deg,
          transparent,
          rgba(255, 208, 124, 0.52),
          transparent 34%,
          rgba(255, 240, 197, 0.32),
          transparent 66%,
          rgba(255, 169, 53, 0.46),
          transparent
        );
        filter: blur(1px);
      }

      .logo-wrap::after {
        inset: 10%;
        border: 1px solid rgba(255, 236, 190, 0.18);
        box-shadow:
          inset 0 0 18px rgba(255, 214, 143, 0.16),
          0 0 26px rgba(255, 175, 64, 0.16);
      }

      .splash-logo {
        position: relative;
        z-index: 1;
        width: 78%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.56));
        animation: logoSpin 9s linear infinite;
      }

      .splash-title {
        margin: 8px 0 0;
        display: grid;
        justify-items: center;
        gap: 5px;
        color: #ffe4a8;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.15rem, 9vw, 3.35rem);
        line-height: 0.98;
        letter-spacing: 0.01em;
      }

      .title-line {
        display: block;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(16px);
        background: linear-gradient(92deg, #fff6d4 0%, #ffd16d 22%, #ff9d22 42%, #fff0bd 58%, #ffd16d 76%, #fff6d4 100%);
        background-size: 240% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 10px 30px rgba(255, 126, 0, 0.24);
        animation:
          titleReveal 950ms cubic-bezier(0.18, 1, 0.22, 1) 520ms forwards,
          titleColorTravel 4.2s ease-in-out 1.2s infinite,
          titleGlow 3s ease-in-out 1.6s infinite;
      }

      .title-trace {
        width: min(64vw, 270px);
        height: 2px;
        margin-top: 9px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 219, 150, 0.94), transparent);
        transform: scaleX(0.12);
        opacity: 0;
        filter: drop-shadow(0 0 14px rgba(255, 177, 74, 0.7));
        animation: traceReveal 780ms ease-out 980ms forwards;
      }

      .splash-tagline {
        max-width: 430px;
        margin: 0;
        color: rgba(255, 230, 180, 0.9);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(0.98rem, 3.8vw, 1.22rem);
        line-height: 1.3;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.48);
        opacity: 0;
        transform: translateY(10px);
        animation: splashFadeUp 800ms ease-out 1.05s forwards;
      }

      .platform-line {
        margin: -3px 0 0;
        color: rgba(255, 222, 162, 0.76);
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(8px);
        animation: splashFadeUp 700ms ease-out 1.2s forwards;
      }

      @media (min-width: 720px) {
        .splash-tagline {
          max-width: none;
          white-space: nowrap;
        }
      }

      .splash-loading {
        width: min(58vw, 230px);
        height: 4px;
        margin-top: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 229, 181, 0.14);
        opacity: 0;
        animation: ctaReveal 500ms ease-out 1.34s forwards;
      }

      .splash-loading span {
        display: block;
        width: 46%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff9d22, #ffdf95, #ff8a00);
        box-shadow: 0 0 16px rgba(255, 166, 50, 0.7);
        animation: loadingRun 1.25s ease-in-out infinite;
      }

      .splash-cta {
        margin: 2px 0 0;
        color: rgba(255, 222, 162, 0.78);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0;
        animation: ctaReveal 700ms ease-out 1.5s forwards;
      }

      @keyframes splashLogoEnter {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }

        50% {
          transform: translateY(-7px) scale(1.015);
        }
      }

      @keyframes logoSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes titleReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes titleGlow {
        0%,
        100% {
          filter: brightness(1);
        }

        50% {
          filter: brightness(1.12);
        }
      }

      @keyframes titleColorTravel {
        0%,
        100% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }
      }

      @keyframes traceReveal {
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @keyframes splashFadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ctaReveal {
        to {
          opacity: 1;
        }
      }

      @keyframes loadingRun {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(230%);
        }
      }

      @keyframes splashOrbit {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @keyframes starDrift {
        0%,
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.72;
        }

        50% {
          transform: translateY(-10px) scale(1.18);
          opacity: 1;
        }
      }

      @keyframes splashStars {
        0%,
        100% {
          opacity: 0.72;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes splashRayExpand {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.04) rotate(0deg);
        }

        18% {
          opacity: 0.88;
        }

        64% {
          opacity: 0.52;
          transform: translate(-50%, -50%) scale(1) rotate(145deg);
        }

        82% {
          opacity: 0.38;
          transform: translate(-50%, -50%) scale(1.08) rotate(190deg);
        }

        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1.12) rotate(230deg);
        }
      }

      @keyframes templeRise {
        to {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
      }

      @keyframes glitterPulse {
        0%,
        100% {
          opacity: 0.32;
          filter: drop-shadow(0 0 0 rgba(255, 212, 126, 0));
        }

        45% {
          opacity: 1;
          filter: drop-shadow(0 0 8px rgba(255, 212, 126, 0.74));
        }

        70% {
          opacity: 0.48;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-page *,
        .splash-page::before {
          animation: none !important;
        }

        .splash-eyebrow,
        .logo-wrap,
        .title-line,
        .title-trace,
        .splash-tagline,
        .platform-line,
        .splash-loading,
        .splash-cta {
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 380px) {
        .splash-content {
          padding-inline: 14px;
        }

        .splash-title {
          font-size: 2rem;
        }
      }

      @media (max-height: 720px) {
        .splash-content {
          padding-top: 3svh;
          gap: 10px;
        }

        .logo-wrap {
          width: clamp(112px, 30vw, 150px);
        }

        .splash-temple {
          bottom: -36px;
          max-height: 48svh;
        }
      }
    </style>
  </head>
  <body>
    <main class="page splash-page">
      <div class="splash-sky" aria-hidden="true">
        <span class="splash-light-rays"></span>
        <img src="./temple-transparent.png" alt="" class="splash-temple" />
        <span class="splash-star star-one"></span>
        <span class="splash-star star-two"></span>
        <span class="splash-star star-three"></span>
        <span class="splash-arc arc-one"></span>
        <span class="splash-arc arc-two"></span>
      </div>

      <div class="splash-content">
        <div class="logo-wrap">
          <img src="./yt-logo.png" alt="YGT logo" class="splash-logo" />
        </div>
        <p class="splash-eyebrow">Launching Soon</p>
        <h1 class="splash-title" aria-label="Your Good Time">
          <span class="title-line">Your Good Time</span>
          <span class="title-trace" aria-hidden="true"></span>
        </h1>
        <p class="splash-tagline">Astrology Guidance for Your Good Time</p>
        <p class="platform-line">Coming to Web . Android . iOS</p>
        <div class="splash-loading" aria-hidden="true">
          <span></span>
        </div>
      </div>
    </main>
  </body>
</html>
